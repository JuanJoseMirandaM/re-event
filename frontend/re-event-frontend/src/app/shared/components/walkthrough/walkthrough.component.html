<div class="walkthrough-container">
  <div class="walkthrough-image-section">
    <div class="image-container">
      <img
              [src]="currentStepData.imageUrl"
              [alt]="currentStepData.imageAlt"
              class="step-image"
              (error)="onImageError($event)">
    </div>
  </div>

  <div class="walkthrough-content-section flex flex--col gap-6 p-8">
    <p class="text-2xl font-semibold text-center">
      {{ currentStepData.title }}
    </p>

    <p class="text-base font-light leading-tight text-center">
      {{ currentStepData.description }}
    </p>

    <div class="progress-dots">
      @for (step of walkthroughSteps; track step.id; let i = $index) {
        <button
                class="progress-dot"
                [class.active]="i === currentStep()"
                (click)="onDotClick(i)"
                [attr.aria-label]="'Ir al paso ' + (i + 1)">
        </button>
      }
    </div>

    <div class="flex gap-2 justify-center">
      @if (!isLastStep) {
        <button class="btn btn--secondary"
                (click)="onSkip()">
          Saltar
        </button>

        <button class="btn btn--primary"
                (click)="onContinue()">
          Continuar
        </button>
      } @else {
        <button class="btn btn--primary"
                (click)="onContinue()">
          Comenzar
        </button>
      }
    </div>
  </div>
</div>

<div class="notification-icon">
  <span class="material-symbols-outlined">info</span>
</div>

<div class="notification-body" (click)="onMarkAsRead()">
  <p class="text-base font-medium py-1">{{ notification().title }}</p>
  <p class="text-sm font-light py-2">{{ notification().body }}</p>
  <p class="text-xs font-light">{{ notification().createdAt | date:'hh:mm a' }}</p>
</div>

<div class="notification-button">
  <button class="btn">
    <span class="material-symbols-outlined">chevron_forward</span>
  </button>
</div>

<div class="notification-icon"[class.notification-icon-no-read]="!notification().read">
  <span class="material-symbols-outlined">info</span>
</div>

<div class="notification-body" (click)="onMarkAsRead()">
  <p class="text-base font-medium py-1">{{ notification().title }}</p>
  <p class="text-sm font-light py-2">{{ notification().description }}</p>
  <p class="text-xs font-light">{{ notification().createdAt | date: 'short' }}</p>
  
  <!-- TODO: Mostrar link si existe -->
  @if (notification().link) {
    <div class="re-notification-link">
      <a [href]="notification().link"
         [target]="notification().link?.startsWith('http') ? '_blank' : '_self'"
         (click)="$event.stopPropagation()"
         class="re-link">
        {{ notification().link?.startsWith('http') ? 'Ver enlace' : 'Ver más' }}
      </a>
    </div>
  }
</div>

<div class="notification-button">
  <button class="btn">
    <span class="material-symbols-outlined">chevron_forward</span>
  </button>
</div>

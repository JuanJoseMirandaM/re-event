<span class="text-lg font-medium py-2">{{ event().title }}</span>

<div class="flex gap-2">
  <span class="text-lg material-symbols-outlined">schedule</span>
  <span class="text-base font-light">{{ getStartTime() }} - {{ getStartTime() }}</span>
</div>

<div class="flex gap-2">
  <span class="text-lg material-symbols-outlined">hourglass_top</span>
  <span class="text-base font-light">{{ event().time | duration }}</span>
</div>

<div class="flex gap-2">
  <span class="text-lg material-symbols-outlined">location_on</span>
  <span class="text-base font-light">{{ event().location }}</span>
</div>

<div class="flex gap-2">
  <span class="text-lg material-symbols-outlined">group</span>
  <span class="text-base font-light">{{ getSpeakerNames() }}</span>
</div>

@if (isPastEvent()) {
  <button class="btn btn--secondary btn--sm">Calificar &starf;</button>
}

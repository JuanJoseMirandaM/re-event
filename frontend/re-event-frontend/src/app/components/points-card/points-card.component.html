<div>
  <span class="text-2xl material-symbols-outlined" [style.color]="'var(--primary-lilac)'">cards_star</span>
</div>

<div class="flex re-flex-1 flex--col gap-1">
  <span class="text-base font-normal">{{ pointsDetail().description }}</span>
  <span class="text-xs font-light">{{ pointsDetail().timestamp | relativeDate }}
    , {{ pointsDetail().timestamp | date: 'short' }}</span>
</div>

<div class="flex flex--col items-center">
  <span class="text-xl font-medium">
    @if (pointsDetail().points > 0) {
      +{{ pointsDetail().points }}
    } @else {
      {{ pointsDetail().points }}
    }
  </span>

  <span class="text-xs font-light">puntos</span>
</div>

<div id="reader" class="qr-fullscreen" aria-label="Camera preview"></div>

<div class="qr-overlay qr-header" role="banner">
  <button type="button" class="qr-close-btn" aria-label="Close scanner" (click)="onClose()">✕</button>
  <h1 class="qr-title" aria-level="1">{{ 'qr.scanTitle' | translate }}</h1>
</div>

<div class="qr-overlay qr-footer" role="contentinfo">
  <button type="button" class="qr-manual-btn" (click)="onEnterCode()">{{ 'qr.enterUserIdManually' | translate }}</button>
</div>

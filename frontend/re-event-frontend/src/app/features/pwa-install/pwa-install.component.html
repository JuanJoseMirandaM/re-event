<div class="install-container">
  <div class="language-selector-container">
    <app-language-selector></app-language-selector>
  </div>
  <div class="install-content">
    <div class="logo-container">
      <img
        src="/icons/icon-512x512.png"
        alt="Kinua Logo"
        class="logo"
      >
    </div>

    <h1 class="title">{{ 'pwa.title' | translate }}</h1>
    <p class="subtitle">{{ 'pwa.subtitle' | translate }}</p>

    <button
      class="install-button"
      [class.hidden]="!canInstall()"
      (click)="installApp()"
      [disabled]="isInstalling()"
    >
      <span class="material-symbols-outlined">download</span>
      {{ isInstalling() ? ('pwa.installing' | translate) : ('pwa.install' | translate) }}
    </button>

    <div class="ios-instructions" [class.show]="showIOSInstructions()">
      <div class="instructions-header">
        <span class="material-symbols-outlined">check_circle</span>
        <span>{{ 'pwa.iosTitle' | translate }}</span>
      </div>
      <ol class="instructions-list">
        <li>{{ 'pwa.iosStep1' | translate }}</li>
        <li>{{ 'pwa.iosStep2' | translate }}</li>
        <li>{{ 'pwa.iosStep3' | translate }}</li>
      </ol>
    </div>

    <div class="already-installed" [class.show]="isAlreadyInstalled()">
      <span class="material-symbols-outlined">check</span>
      <span>{{ 'pwa.alreadyInstalled' | translate }}</span>
    </div>
  </div>
</div>

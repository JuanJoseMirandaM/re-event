<div class="re-agenda re-flex re-flex-column">
  @for (dayGroup of eventsByDate(); track dayGroup.date) {
    <div class="date-header">
      <h3>{{ formatDate(dayGroup.date) }}</h3>
    </div>
    @for (event of dayGroup.events; track event.eventId) {
      <app-agenda-card [event]="event"></app-agenda-card>
    }
  }
</div>

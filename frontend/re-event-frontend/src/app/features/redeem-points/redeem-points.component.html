<h2 class="re-h1-title">{{ 'points.redeem.title' | translate }}</h2>

<div class="form-group">
  <label class="form-label" for="user-id-input">{{ 'points.redeem.userIdLabel' | translate }}</label>
  <input id="user-id-input" class="form-input" type="text" [(ngModel)]="userId"
         [placeholder]="'points.redeem.userIdPlaceholder' | translate">
</div>

<div class="form-group">
  <label class="form-label" for="points-input">{{ 'points.redeem.pointsLabel' | translate }}</label>
  <input id="points-input" class="form-input" type="number" [(ngModel)]="points"
         (ngModelChange)="onFieldChange()" [placeholder]="'points.redeem.pointsPlaceholder' | translate">
</div>

<div class="point-buttons">
  <button class="btn btn--secondary" (click)="setPoints(50)">50</button>
  <button class="btn btn--secondary" (click)="setPoints(100)">100</button>
  <button class="btn btn--secondary" (click)="setPoints(150)">150</button>
  <button class="btn btn--secondary" (click)="setPoints(200)">200</button>
</div>

<div class="form-group">
  <label class="form-label" for="description-input">{{ 'points.redeem.descriptionLabel' | translate }}</label>
  <input id="description-input" class="form-input" [(ngModel)]="description"
         (ngModelChange)="onFieldChange()" [placeholder]="'points.redeem.descriptionPlaceholder' | translate">
</div>

<button class="btn btn--primary btn--lg"
        (click)="deductPoints()"
        [disabled]="!userId || !points || points <= 0 || !description">
  <i class="icon-shopping-cart"></i>
  <span>{{ 'points.redeem.execute' | translate }}</span>
</button>

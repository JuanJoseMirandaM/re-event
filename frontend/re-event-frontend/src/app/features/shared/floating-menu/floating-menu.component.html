@let admin = isAdmin() ;

@if (isVisible()) {
  <section class="floating-menu-container">
    <div class="floating-menu">
      <div class="floating-menu-items" [class.open]="isMenuOpen()">
        @if (admin) {
          <button class="floating-menu-item" (click)="createEvent()">
            <span class="material-symbols-outlined">edit_calendar</span>
          </button>
        }

        @if (admin) {
          <button class="floating-menu-item" (click)="createNotification()">
            <span class="material-symbols-outlined">notification_important</span>
          </button>
        }

        <button class="floating-menu-item" (click)="redirectToQrScanner()">
          <span class="material-symbols-outlined">qr_code_scanner</span>
        </button>
      </div>

      <button class="floating-menu-btn btn btn--primary" [class.open]="isMenuOpen()" (click)="toggleMenu()"
              type="button">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>
  </section>
}

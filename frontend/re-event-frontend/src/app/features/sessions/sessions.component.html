<div class="px-4 py-2 flex flex--col gap-4">
  <div class="filter-tabs">
    <div class="filter-tabs__container">
      <button
        class="filter-chip"
        [class.filter-chip--active]="activeFilter() === 'upcoming'"
        (click)="onFilterChange('upcoming')">
        {{ 'sessions.upcomingSessions' | translate }}
      </button>

      <button
        class="filter-chip"
        [class.filter-chip--active]="activeFilter() === 'favorites'"
        (click)="onFilterChange('favorites')">
        {{ 'sessions.favorites' | translate }}
      </button>

      <button
        class="filter-chip"
        [class.filter-chip--active]="activeFilter() === 'past'"
        (click)="onFilterChange('past')">
        {{ 'sessions.pastSessions' | translate }}
      </button>

      <button
        class="filter-chip"
        [class.filter-chip--active]="activeFilter() === 'all'"
        (click)="onFilterChange('all')">
        {{ 'sessions.allSessions' | translate }}
      </button>
    </div>
  </div>

  <div class="filter-tabs">
    <div class="filter-tabs__container">
      <select 
        class="filter-select"
        [value]="selectedLocation()"
        (change)="onLocationChange($event)">
        <option value="">{{ 'sessions.allLocations' | translate }}</option>
        <option 
          *ngFor="let location of availableLocations()" 
          [value]="location">
          {{ location }}
        </option>
      </select>
    </div>
  </div>

  <app-sessions-list
    [activeFilter]="activeFilter()"
    [selectedTags]="selectedTags()"
    [selectedLocation]="selectedLocation()"
    (tagsLoaded)="onTagsLoaded($event)"
    (locationsLoaded)="onLocationsLoaded($event)">
  </app-sessions-list>
</div>

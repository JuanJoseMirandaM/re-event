<button class="re-btn re-big-font re-icon-header" (click)="toggleMenu()" aria-label="Abrir menú"
        aria-controls="app-side-menu">
  <span class="re-icon-menu re-inline-block"></span>
</button>

<span class="re-txt-bold re-big-font">AWS Community</span>

<div class="re-inline-block re-icon-header">
  <button class="re-btn re-big-font" routerLink="./notifications" aria-label="Ir a notificaciones">
    <span class="re-icon-notification"></span>
    @if (unreadCount() > 0) {
      <span class="re-icon-header__number"></span>
    }
  </button>
</div>

<app-side-menu [isMenuOpen]="menuOpen()" (menuClosed)="toggleMenu()"/>
